name: Build the extension

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build the extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext libglib2.0-bin

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rounded-window-corners@choco2233.shell-extension
          path: _build/
          compression-level: 9
